<H2><A NAME="SECTION000131000000000000000">&#160;</A><A NAME="TCLnewwin">&#160;</A>
<BR>
newwin
</H2>

<P>
Syntax:

<P>
<TT>newwin</TT> <EM>name</EM>

<P>
Creates a new toplevel window for a TCL widget, with Tk identifier
<EM>name</EM>. <EM>name</EM> must start with a full stop.
